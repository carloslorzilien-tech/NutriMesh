<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <defs>
    <clipPath id="sphere-clip">
      <circle cx="90" cy="90" r="80"/>
    </clipPath>
  </defs>

  <!-- ── Mesh strands clipped to sphere ── -->
  <g clip-path="url(#sphere-clip)" stroke="#059669" stroke-width="5"
     stroke-linecap="round" fill="none">

    <!-- Outer sphere boundary (drawn as strand so it participates in weave) -->
    <circle cx="90" cy="90" r="80" stroke-width="5"/>

    <!-- Diagonal A — upper-left → lower-right -->
    <path d="M 18 52 C 42 66, 68 79, 90 90 C 112 101, 138 116, 162 134"/>
    <!-- Diagonal B — upper-right → lower-left -->
    <path d="M 162 52 C 138 66, 112 79, 90 90 C 68 101, 42 116, 18 134"/>

    <!-- Left-side arc -->
    <path d="M 32 26 C 4  52, 4  128, 32 154"/>
    <!-- Right-side arc -->
    <path d="M 148 26 C 176 52, 176 128, 148 154"/>

    <!-- Top arc -->
    <path d="M 48 14 C 68  4, 112  4, 132 14"/>
    <!-- Bottom arc -->
    <path d="M 44 168 C 66 178, 114 178, 136 168"/>

    <!-- Secondary diagonal A' (offset from A) -->
    <path d="M 10 70 C 36 78, 64 85, 90 90 C 116 95, 144 105, 168 116"/>
    <!-- Secondary diagonal B' (offset from B) -->
    <path d="M 168 70 C 144 78, 116 85, 90 90 C 64 95, 36 105, 10 116"/>

    <!-- Upper-left secondary arc -->
    <path d="M 20 36 C 28 52, 38 65, 55 78"/>
    <!-- Upper-right secondary arc -->
    <path d="M 160 36 C 152 52, 142 65, 125 78"/>
    <!-- Lower-left secondary arc -->
    <path d="M 55 104 C 38 116, 28 130, 20 148"/>
    <!-- Lower-right secondary arc -->
    <path d="M 125 104 C 142 116, 152 130, 160 148"/>
  </g>

  <!-- ── Sphere border on top to crisp up the edge ── -->
  <circle cx="90" cy="90" r="80" stroke="#059669" stroke-width="5" fill="none"/>

  <!-- ── Leaf — drawn last, on top, no white background needed ── -->
  <!-- Left half of leaf -->
  <path d="M 90 70 C 76 78, 73 97, 90 112"
        stroke="#059669" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Right half of leaf -->
  <path d="M 90 70 C 104 78, 107 97, 90 112"
        stroke="#059669" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Center vein -->
  <line x1="90" y1="70" x2="90" y2="112"
        stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>
</svg>
